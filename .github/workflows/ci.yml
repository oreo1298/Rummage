name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so new lints in a newer toolchain cannot break CI unexpectedly; bump deliberately.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The Qt GUI needs Qt ≥ 6.8 and Kirigami: linted and tested in the gui-qt job.
      - run: cargo clippy --workspace --exclude fossick-qt --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude fossick-qt

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude fossick-qt --lib --bins

  # The Qt/Kirigami GUI, in the distribution with the oldest Qt it supports well (Qt 6.10,
  # KF6): build, lint, then offscreen screenshots against a user-mode daemon.
  gui-qt:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
    steps:
      - name: Qt, Kirigami and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git build-essential \
            pkg-config qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-declarative-dev-tools qml6-module-org-kde-kirigami qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-dialogs \
            qml6-module-qt-labs-platform qml6-module-qtqml-models qml6-module-qtquick-shapes \
            qml6-module-org-kde-desktop libqt6svg6 qt6-svg-plugins breeze-icon-theme libgl-dev \
            dbus fonts-noto-core
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-qt
      - run: cargo clippy -p fossick-qt --all-targets -- -D warnings
      - run: cargo build -p fossick-qt -p fossickd -p fossick
      - name: Offscreen screenshots (KDE style)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          XDG_CURRENT_DESKTOP: KDE
        run: tests/gui/screenshot.sh shots/kde target/debug
      - name: Offscreen screenshots (Fusion style)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: tests/gui/screenshot.sh shots/fusion target/debug
      - uses: actions/upload-artifact@v4
        with:
          name: gui-qt-screenshots
          path: shots

  # Instruction counts (Callgrind) are deterministic, so they can gate: fail if any benchmark
  # needs more than 10% more instructions than on the base commit. Wall-clock numbers are only
  # reported (docs/BENCHMARKS.md), never gated, because shared runners are noisy.
  bench-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo install gungraun-runner --version 0.20.0 --locked
      - name: Baseline from the base commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null \
             && git cat-file -e "${BASE}:crates/bench/benches/instructions.rs" 2>/dev/null; then
            git checkout -q "$BASE"
            cargo bench -p fossick-bench --bench instructions -- --save-baseline=base
            git checkout -q "$GITHUB_SHA"
            echo "HAVE_BASE=1" >> "$GITHUB_ENV"
          else
            echo "No comparable base commit; running without a baseline."
          fi
      - name: Compare (fails on a >10% instruction-count regression)
        run: |
          if [ "${HAVE_BASE:-0}" = 1 ]; then
            cargo bench -p fossick-bench --bench instructions -- --baseline=base --callgrind-limits='ir=10%'
          else
            cargo bench -p fossick-bench --bench instructions
          fi

  fuzz-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz each target for 60 s
        run: |
          mkdir -p fuzz/corpus/query_parser fuzz/corpus/snapshot_loader fuzz/corpus/ipc_decoder
          cargo +nightly fuzz run query_parser fuzz/corpus/query_parser fuzz/seeds/query_parser -- -max_total_time=60
          cargo +nightly fuzz run snapshot_loader fuzz/corpus/snapshot_loader fuzz/seeds/snapshot_loader -- -max_len=400000 -max_total_time=60
          cargo +nightly fuzz run ipc_decoder fuzz/corpus/ipc_decoder fuzz/seeds/ipc_decoder -- -max_total_time=60

  # Daemon integration tests on loop-mounted filesystems: event storms (the index must equal a
  # fresh walk) under fanotify and inotify, and multi-user permission filtering compared with
  # `find` run as each user. GitHub's Ubuntu runners have passwordless sudo and loop devices.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [ext4, xfs, btrfs, f2fs, vfat, exfat, ntfs3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y acl xfsprogs btrfs-progs f2fs-tools dosfstools exfatprogs ntfs-3g
          # Cloud kernels ship some filesystems (exfat, ntfs3) only in the extra modules.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe ${{ matrix.fs }} || true
          uname -r
      - run: cargo build --release -p fossickd -p fossick
      - name: Storm (default watcher)
        run: sudo env FSTYPE=${{ matrix.fs }} DEBUG=1 OPS=8000 tests/integration/storm.sh
      - name: Storm (inotify)
        run: sudo env FSTYPE=${{ matrix.fs }} DEBUG=1 WATCH=inotify OPS=5000 tests/integration/storm.sh
      - name: Multi-user visibility
        if: contains(fromJSON('["ext4", "xfs", "btrfs", "f2fs"]'), matrix.fs)
        run: sudo env FSTYPE=${{ matrix.fs }} tests/integration/multiuser.sh
      - name: Configuration reload
        if: matrix.fs == 'ext4'
        run: sudo tests/integration/reload.sh

  # The packaged systemd units: hardening, privileges, filtering, hotplugged mounts.
  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p fossickd -p fossick
      - run: sudo tests/integration/systemd.sh
